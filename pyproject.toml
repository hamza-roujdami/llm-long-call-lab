[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []  # dependency list only; the code runs from the repo (python -m worker, uvicorn api.main:app)

[project]
name = "apim-timeout-lab"
version = "0.1.0"
description = "Measure where long LLM calls get cut on Azure (ACA Job -> direct | APIM -> Foundry)"
requires-python = ">=3.13"
# Dev environment for tests and linting. The container images install their own runtime deps.
dependencies = [
  "agent-framework-core>=1.21",
  "agent-framework-openai>=1.16",
  "openai>=1.109",
  "httpx>=0.28",
  "pydantic-settings>=2.6",
  "azure-identity>=1.19",
  "aiohttp>=3.10",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # long prose strings in prompts/docs; the formatter handles code

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["worker/tests", "api"]
pythonpath = ["."]
